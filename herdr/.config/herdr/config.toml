onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

auto_switch = false
[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
settings = "prefix+shift+s"

# Config and help
# reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+f"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+v", "alt+enter"]
split_vertical = ["prefix+i", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+q"
switch_tab = "alt+1..9"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+q"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]
switch_workspace = "prefix+1..9"

# Agents
next_agent = "prefix+alt+n"
previous_agent = "prefix+alt+p"

# AZERTY: prefix + number key without Shift focuses tab 1..9
[[keys.command]]
key = "prefix+&"
type = "shell"
command = "~/.config/herdr/focus-tab.sh 1"

[[keys.command]]
key = "prefix+é"
type = "shell"
command = "~/.config/herdr/focus-tab.sh 2"

[[keys.command]]
key = "prefix+\""
type = "shell"
command = "~/.config/herdr/focus-tab.sh 3"

[[keys.command]]
key = "prefix+'"
type = "shell"
command = "~/.config/herdr/focus-tab.sh 4"

[[keys.command]]
key = "prefix+("
type = "shell"
command = "~/.config/herdr/focus-tab.sh 5"

[[keys.command]]
key = "prefix+-"
type = "shell"
command = "~/.config/herdr/focus-tab.sh 6"

[[keys.command]]
key = "prefix+è"
type = "shell"
command = "~/.config/herdr/focus-tab.sh 7"

[[keys.command]]
key = "prefix+_"
type = "shell"
command = "~/.config/herdr/focus-tab.sh 8"

[[keys.command]]
key = "prefix+ç"
type = "shell"
command = "~/.config/herdr/focus-tab.sh 9"

# Harpoon: prefix+a marks the tab, prefix+y opens the list,
# prefix+alt+1..0 jumps to mark 1..10 (AZERTY &é"'(-è_çà works too)
[[keys.command]]
key = "prefix+a"
type = "shell"
command = "~/.config/herdr/harpoon.sh add"

[[keys.command]]
key = "prefix+y"
type = "popup"
command = "~/.config/herdr/harpoon.sh menu"
width = "50%"
height = 15

[[keys.command]]
key = "prefix+alt+1"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 1"

[[keys.command]]
key = "prefix+alt+&"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 1"

[[keys.command]]
key = "prefix+alt+2"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 2"

[[keys.command]]
key = "prefix+alt+é"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 2"

[[keys.command]]
key = "prefix+alt+3"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 3"

[[keys.command]]
key = "prefix+alt+\""
type = "shell"
command = "~/.config/herdr/harpoon.sh go 3"

[[keys.command]]
key = "prefix+alt+4"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 4"

[[keys.command]]
key = "prefix+alt+'"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 4"

[[keys.command]]
key = "prefix+alt+5"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 5"

[[keys.command]]
key = "prefix+alt+("
type = "shell"
command = "~/.config/herdr/harpoon.sh go 5"

[[keys.command]]
key = "prefix+alt+6"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 6"

[[keys.command]]
key = "prefix+alt+-"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 6"

[[keys.command]]
key = "prefix+alt+7"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 7"

[[keys.command]]
key = "prefix+alt+è"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 7"

[[keys.command]]
key = "prefix+alt+8"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 8"

[[keys.command]]
key = "prefix+alt+_"
type = "shell"
command = "~/.config/herdr/harpoon.sh go 8"

[[keys.command]]
key = "prefix+alt+9"
